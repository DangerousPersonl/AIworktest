<h2>选择设计风格</h2>
<p class="subtitle">为AI证件照头像制作小程序选择一个主视觉风格</p>

<div class="cards">
  <div class="card" data-choice="modern" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px; text-align: center; color: white;">
      <div style="font-size: 48px; margin-bottom: 16px;">✨</div>
      <h3 style="margin: 0; font-size: 24px;">现代简约</h3>
      <p style="margin: 8px 0 0; opacity: 0.9;">清新、时尚、科技感</p>
    </div>
    <div class="card-body">
      <h3>现代简约</h3>
      <p>大圆角、柔和渐变、清空白、简洁卡片式布局，强调用户体验和视觉层次</p>
    </div>
  </div>

  <div class="card" data-choice="cute" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 40px; text-align: center; color: white;">
      <div style="font-size: 48px; margin-bottom: 16px;">🎨</div>
      <h3 style="margin: 0; font-size: 24px;">可爱卡通</h3>
      <p style="margin: 8px 0 0; opacity: 0.9;">活泼、趣味、年轻化</p>
    </div>
    <div class="card-body">
      <h3>可爱卡通</h3>
      <p>丰富色彩、趣味图标、插画元素，吸引年轻用户群体，增加趣味性</p>
    </div>
  </div>

  <div class="card" data-choice="professional" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%); padding: 40px; text-align: center; color: white;">
      <div style="font-size: 48px; margin-bottom: 16px;">💼</div>
      <h3 style="margin: 0; font-size: 24px;">专业商务</h3>
      <p style="margin: 8px 0 0; opacity: 0.9;">稳重、可靠、信任感</p>
    </div>
    <div class="card-body">
      <h3>专业商务</h3>
      <p>深蓝/灰色调、规整布局、简洁直观，给用户专业、可靠的感觉</p>
    </div>
  </div>

  <div class="card" data-choice="keep" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%); padding: 40px; text-align: center; color: #333;">
      <div style="font-size: 48px; margin-bottom: 16px;">👍</div>
      <h3 style="margin: 0; font-size: 24px;">保持现有</h3>
      <p style="margin: 8px 0 0; opacity: 0.8;">当前UI已不错</p>
    </div>
    <div class="card-body">
      <h3>保持现有</h3>
      <p>当前的UI已经很不错，只需要小幅度优化和调整</p>
    </div>
  </div>
</div>
