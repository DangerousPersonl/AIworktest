<h2>选择配色方案</h2>
<p class="subtitle">为专业商务风格选择主色调</p>

<div class="cards">
  <div class="card" data-choice="blue" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 32px;">
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
        <div style="width: 60px; height: 60px; background: #1a365d; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #2b6cb0; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #4299e1; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px;"></div>
      </div>
      <h3 style="margin: 0; font-size: 18px; color: #1a365d;">专业深蓝</h3>
    </div>
    <div class="card-body">
      <h3>专业深蓝</h3>
      <p>传统商务色彩，给人可靠、稳重、权威的感觉，适合证件照这类严肃用途</p>
    </div>
  </div>

  <div class="card" data-choice="teal" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 32px;">
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
        <div style="width: 60px; height: 60px; background: #234e52; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #2c7a7b; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #38b2ac; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #f0fff4; border: 1px solid #c6f6d5; border-radius: 8px;"></div>
      </div>
      <h3 style="margin: 0; font-size: 18px; color: #234e52;">科技青蓝</h3>
    </div>
    <div class="card-body">
      <h3>科技青蓝</h3>
      <p>现代商务色彩，兼具专业感和科技感，适合AI工具类产品</p>
    </div>
  </div>

  <div class="card" data-choice="gray" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 32px;">
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
        <div style="width: 60px; height: 60px; background: #1a202c; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #4a5568; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #718096; border-radius: 8px;"></div>
        <div style="width: 60px; height: 60px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;"></div>
      </div>
      <h3 style="margin: 0; font-size: 18px; color: #1a202c;">极简灰色</h3>
    </div>
    <div class="card-body">
      <h3>极简灰色</h3>
      <p>黑白灰为主，简约高级，突出内容本身，适合追求极致简洁的设计</p>
    </div>
  </div>
</div>
